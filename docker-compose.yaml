services:
  postgres:
    image: postgres:16
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: inventory_management
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # This line automatically runs schema.sql when the database is created for the first time!
      - ./Database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  postgres_data:
